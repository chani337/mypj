version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: smart-farm-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-smart_farm}
      MYSQL_USER: ${DB_USER:-smartfarm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-smartfarm123!}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-farm-net

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: smart-farm-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${DB_NAME:-smart_farm}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-smartfarm}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-smartfarm123!}
      AI_SERVER_URL: http://ai:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smart-farm-net

  # FastAPI AI Server
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile.local
    container_name: smart-farm-ai
    restart: always
    environment:
      ENV: local
      PORT: 8000
    ports:
      - "${AI_PORT:-8000}:8000"
    volumes:
      - ./ai/app:/app/app
      - ./ai/data:/app/data
      - ./ai/app/models:/app/models
    networks:
      - smart-farm-net

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: smart-farm-frontend
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_AI_BASE_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - smart-farm-net

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: smart-farm-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/local/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - ai
    networks:
      - smart-farm-net

networks:
  smart-farm-net:
    driver: bridge

volumes:
  mysql_data:
