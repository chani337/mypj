version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: smart-farm-prod-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-farm-prod-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-farm-prod-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      AI_SERVER_URL: http://ai:8000
    depends_on:
      database:
        condition: service_healthy
    networks:
      - smart-farm-prod-net

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: smart-farm-prod-ai
    restart: always
    environment:
      ENV: production
      PORT: 8000
    networks:
      - smart-farm-prod-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: smart-farm-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - ai
    networks:
      - smart-farm-prod-net

networks:
  smart-farm-prod-net:
    driver: bridge

volumes:
  mysql_prod_data:
