spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: smart-farm-backend
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true

jwt:
  secret: ${JWT_SECRET:default_jwt_secret_key_smart_farm_platform_2026_super_secure}
  expiration: 86400000 # 24 hours

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
